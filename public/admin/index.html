<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel — Papito's Burguer</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e0b09">
  <link rel="icon" href="/img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <!-- Login -->
  <section id="loginView" class="login hidden">
    <form id="loginForm" class="panel">
      <img src="/img/logo.jpg" alt="" width="88" height="88">
      <h1>Painel do dono</h1>
      <div id="loginError" class="alert hidden" role="alert"></div>
      <label class="field"><span>Usuário</span><input type="text" name="username" autocomplete="username" required></label>
      <label class="field"><span>Senha</span><input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn block">Entrar</button>
      <p style="text-align:center;margin:14px 0 0"><a href="/">← Voltar ao cardápio</a></p>
    </form>
  </section>

  <!-- Painel -->
  <div id="appView" class="hidden">
    <header class="topbar">
      <div class="wrap">
        <a class="brand" href="/" target="_blank" rel="noopener"><img src="/img/logo.jpg" alt="" width="40" height="40"><strong>Painel</strong></a>
        <label class="open-toggle" title="Abrir/fechar a loja para pedidos">
          <input type="checkbox" id="openToggle"><span class="slider"></span><span id="openLabel">Loja aberta</span>
        </label>
        <span class="spacer"></span>
        <button class="btn small ghost" id="logoutBtn">Sair</button>
      </div>
      <nav class="tabs wrap" id="tabs">
        <button data-tab="orders" class="active">Pedidos <span class="tab-badge hidden" id="newBadge">0</span></button>
        <button data-tab="products">Produtos</button>
        <button data-tab="addons">Adicionais</button>
        <button data-tab="categories">Categorias</button>
        <button data-tab="settings">Configurações</button>
      </nav>
    </header>

    <main class="wrap admin-main">
      <!-- Pedidos -->
      <section data-view="orders">
        <div class="toolbar">
          <h2>Pedidos</h2>
          <span class="spacer"></span>
          <select id="orderFilter" aria-label="Filtrar pedidos">
            <option value="active">Em andamento</option>
            <option value="all">Todos (últimos 2 dias)</option>
            <option value="aguardando_pagamento">Aguardando pagamento</option>
            <option value="concluido">Concluídos</option>
            <option value="cancelado">Cancelados</option>
          </select>
          <button class="btn small ghost" id="soundBtn" title="Tocar som quando chegar pedido">🔔 Som: ligado</button>
        </div>
        <div id="ordersSummary" class="summary"></div>
        <div id="ordersList" class="orders"></div>
      </section>

      <!-- Produtos -->
      <section data-view="products" class="hidden">
        <div class="toolbar">
          <h2>Produtos</h2>
          <span class="spacer"></span>
          <input type="text" id="productSearch" placeholder="Buscar produto…" style="max-width:220px">
          <button class="btn small" id="newProduct">+ Novo produto</button>
        </div>
        <div id="productsList"></div>
      </section>

      <!-- Adicionais -->
      <section data-view="addons" class="hidden">
        <div class="toolbar"><h2>Adicionais</h2><span class="spacer"></span><button class="btn small" id="newAddon">+ Novo adicional</button></div>
        <p class="muted">Os adicionais aparecem para o cliente ao escolher qualquer lanche que aceite adicionais.</p>
        <div id="addonsList"></div>
      </section>

      <!-- Categorias -->
      <section data-view="categories" class="hidden">
        <div class="toolbar"><h2>Categorias</h2><span class="spacer"></span><button class="btn small" id="newCategory">+ Nova categoria</button></div>
        <div id="categoriesList"></div>
      </section>

      <!-- Configurações -->
      <section data-view="settings" class="hidden">
        <div class="toolbar"><h2>Configurações</h2></div>
        <form id="settingsForm" class="settings-grid">
          <div class="panel">
            <h3>Loja</h3>
            <label class="field"><span>Nome da loja</span><input type="text" name="storeName"></label>
            <label class="field"><span>Frase de destaque</span><input type="text" name="tagline"></label>
            <label class="field"><span>WhatsApp (com DDD)</span><input type="tel" name="whatsapp" placeholder="5563992438018"></label>
            <label class="field"><span>Instagram (sem @)</span><input type="text" name="instagram"></label>
            <label class="field"><span>Horário de funcionamento</span><input type="text" name="hoursText" placeholder="Ex.: Ter a Dom, 18h às 23h"></label>
            <label class="check-row"><input type="checkbox" name="isOpen"><span class="grow">Loja aberta para pedidos</span></label>
          </div>
          <div class="panel">
            <h3>Entrega e retirada</h3>
            <label class="check-row"><input type="checkbox" name="deliveryEnabled"><span class="grow">Aceitar entrega (delivery)</span></label>
            <label class="check-row"><input type="checkbox" name="pickupEnabled"><span class="grow">Aceitar retirada no local</span></label>
            <div class="row2">
              <label class="field"><span>Taxa de entrega (R$)</span><input type="text" name="deliveryFee" inputmode="decimal"></label>
              <label class="field"><span>Pedido mínimo (R$)</span><input type="text" name="minOrder" inputmode="decimal"></label>
            </div>
            <div class="row2">
              <label class="field"><span>Tempo de entrega</span><input type="text" name="deliveryEstimate"></label>
              <label class="field"><span>Tempo p/ retirada</span><input type="text" name="pickupEstimate"></label>
            </div>
            <label class="field"><span>Cidades atendidas (separe por vírgula)</span><input type="text" name="deliveryCities" placeholder="Ex.: Palmas, Porto Nacional — vazio = todas"></label>
            <label class="field"><span>Endereço para retirada</span><input type="text" name="pickupAddress" placeholder="Rua, número, bairro"></label>
          </div>
          <div class="panel">
            <h3>Formas de pagamento</h3>
            <div id="paymentProviderInfo" class="alert info"></div>
            <label class="check-row"><input type="checkbox" name="payPix"><span class="grow">Pix online (QR Code no site)</span></label>
            <label class="check-row"><input type="checkbox" name="payCard"><span class="grow">Cartão de crédito online</span></label>
            <label class="check-row"><input type="checkbox" name="payCashOnDelivery"><span class="grow">Dinheiro na entrega/retirada</span></label>
            <label class="check-row"><input type="checkbox" name="payCardOnDelivery"><span class="grow">Cartão na maquininha (entrega/retirada)</span></label>
          </div>
          <div class="panel">
            <h3>Trocar senha</h3>
            <label class="field"><span>Senha atual</span><input type="password" id="pwCurrent" autocomplete="current-password"></label>
            <label class="field"><span>Nova senha (mín. 8 caracteres)</span><input type="password" id="pwNext" autocomplete="new-password"></label>
            <button type="button" class="btn ghost" id="pwBtn">Alterar senha</button>
          </div>
          <div class="save-bar"><button class="btn">Salvar configurações</button></div>
        </form>
      </section>
    </main>
  </div>

  <!-- Editor de produto -->
  <dialog id="productEditor">
    <form class="modal" id="productEditorForm" novalidate>
      <div class="modal-head"><h2 id="peTitle">Produto</h2><button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button></div>
      <div class="modal-body">
        <div id="peError" class="alert hidden"></div>
        <div class="image-edit">
          <div id="peImage" class="thumb placeholder"></div>
          <div>
            <label class="btn small ghost" id="peUploadLabel">📷 Escolher foto<input type="file" id="peFile" accept="image/jpeg,image/png,image/webp" hidden></label>
            <button type="button" class="link-btn" id="peRemoveImg">Remover foto</button>
            <p class="muted" style="font-size:13px;margin:6px 0 0">JPG, PNG ou WEBP até 5 MB.</p>
          </div>
        </div>
        <label class="field"><span>Nome</span><input type="text" name="name" required maxlength="80"></label>
        <label class="field"><span>Descrição / ingredientes</span><textarea name="description" maxlength="400"></textarea></label>
        <div class="row2">
          <label class="field"><span>Preço (R$)</span><input type="text" name="price" inputmode="decimal" placeholder="0,00" required></label>
          <label class="field"><span>Categoria</span><select name="category_id"></select></label>
        </div>
        <label class="field"><span>Ordem de exibição</span><input type="number" name="sort" min="0" max="9999"></label>
        <label class="check-row"><input type="checkbox" name="active"><span class="grow">Disponível no cardápio</span></label>
        <label class="check-row"><input type="checkbox" name="featured"><span class="grow">Destaque ("Especial da casa")</span></label>
        <label class="check-row"><input type="checkbox" name="accepts_addons"><span class="grow">Aceita adicionais</span></label>
      </div>
      <div class="modal-foot foot-row">
        <button type="button" class="btn ghost small" id="peDelete" style="flex:0">Excluir</button>
        <button class="btn">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- Editor simples (adicional / categoria) -->
  <dialog id="simpleEditor">
    <form class="modal" id="simpleEditorForm" novalidate>
      <div class="modal-head"><h2 id="seTitle">Editar</h2><button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button></div>
      <div class="modal-body">
        <div id="seError" class="alert hidden"></div>
        <label class="field"><span>Nome</span><input type="text" name="name" required maxlength="60"></label>
        <label class="field" id="sePriceField"><span>Preço (R$)</span><input type="text" name="price" inputmode="decimal"></label>
        <label class="field"><span>Ordem de exibição</span><input type="number" name="sort" min="0"></label>
        <label class="check-row"><input type="checkbox" name="active"><span class="grow">Ativo</span></label>
      </div>
      <div class="modal-foot foot-row">
        <button type="button" class="btn ghost small" id="seDelete" style="flex:0">Excluir</button>
        <button class="btn">Salvar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/js/common.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
