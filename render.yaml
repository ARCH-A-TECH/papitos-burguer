# Configuração do Render (Blueprint). No painel do Render: New > Blueprint > escolha este repositório.
# O disco persistente guarda o banco de dados e as fotos dos produtos entre deploys.
# Disco exige um plano pago (o plano gratuito apaga os arquivos a cada deploy/reinício).
services:
  - type: web
    name: papitos-burguer
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: papitos-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USER
        value: admin
      # Senha do painel /admin: o Render pede o valor ao criar o serviço
      - key: ADMIN_PASSWORD
        sync: false
      # Mercado Pago: preenchidos depois (passos 2 e 3). Sem eles o site fica em modo de teste.
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
